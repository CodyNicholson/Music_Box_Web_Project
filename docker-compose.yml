# Music Box Web stack: compiled server + production client build behind nginx.
# Usage: docker compose up --build   then open http://localhost:5173
# JWT_SECRET and DB_PASSWORD must be set (env or .env); pipeline-run.sh generates them in .env
# if missing. Host ports are bound to 127.0.0.1: Docker's iptables rules bypass ufw, so a bare
# "5173:80" would be reachable from outside, skipping Cloudflare Access.
# Postgres is only on backend-net, so the public nginx container cannot reach it.
# CF_TEAM_DOMAIN and CF_POLICY_AUD (in .env) enable Google sign-in through Cloudflare Access.
name: music_box_web

services:
  db:
    image: postgres:16-alpine
    container_name: musicbox-postgres
    environment:
      POSTGRES_USER: musicbox
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: musicbox
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - musicbox_pg_data:/var/lib/postgresql/data
      - ./server/prisma/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicbox -d musicbox"]
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256
    networks:
      - backend-net

  server:
    build: ./server
    container_name: musicbox-server
    environment:
      DATABASE_URL: postgresql://musicbox:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/musicbox
      TEST_DATABASE_URL: postgresql://musicbox:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/musicbox_test
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (at least 16 characters)}
      # Served over HTTPS in production; browsers also accept secure cookies on http://localhost
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Sign-in is Google OAuth through Cloudflare Access; the server verifies the Access JWT.
      # Team domain: Zero Trust -> Settings -> Custom Pages. AUD: Access -> Applications -> (app) -> Overview.
      CF_TEAM_DOMAIN: ${CF_TEAM_DOMAIN:-}
      CF_POLICY_AUD: ${CF_POLICY_AUD:-}
      # Local development only: trust X-Dev-Email / DEV_CF_EMAIL instead of Cloudflare Access
      ALLOW_DEV_AUTH: ${ALLOW_DEV_AUTH:-false}
      DEV_CF_EMAIL: ${DEV_CF_EMAIL:-}
      PORT: "4000"
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - default
      - backend-net
    depends_on:
      db:
        condition: service_healthy

  # Production build served by unprivileged nginx on :80
  client:
    build: ./client
    container_name: rixus-frontend
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    networks:
      - default
      - tunnel-net
    depends_on:
      - server

volumes:
  musicbox_pg_data:

networks:
  # Postgres and the API. Not internal: db publishes a loopback host port.
  backend-net:
  tunnel-net:
    external: true
