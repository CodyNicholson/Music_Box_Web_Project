# Included at server level AND in every location that has its own add_header: nginx drops the
# inherited add_header directives as soon as a location declares one.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# The piano samples are fetched from tonejs.github.io; everything else is this origin, with the API
# proxied under /api/. Vue binds inline styles through the CSSOM, which CSP allows.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://tonejs.github.io; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; media-src 'self' blob: data:" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
