server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    include /etc/nginx/snippets/security-headers.conf;

    # Use Docker's embedded DNS so nginx starts even if the server isn't up yet
    resolver 127.0.0.11 valid=30s ipv6=off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets never change, so let browsers cache them
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Vue Router history mode: unknown paths fall back to the SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $api_upstream http://server:4000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward Cloudflare Access identity headers to the server, which verifies the JWT
        proxy_set_header Cf-Access-Authenticated-User-Email $http_cf_access_authenticated_user_email;
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
    }
}
